name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Same distribution as the development laptop, with ASan/UBSan on.
  fedora:
    name: Fedora x86_64 (sanitizers)
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - name: Install dependencies
        run: >
          dnf install -y gcc-c++ cmake git SDL2-devel SDL2_ttf-devel SDL2_image-devel
          json-devel vlc-devel gtest-devel libasan libubsan
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DTILUV_SANITIZE=ON
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Same CPU architecture and Debian base as Armbian on the Orange Pi Zero 2W.
  debian-arm64:
    name: Debian arm64 (device target)
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends g++ cmake pkg-config git ca-certificates \
            libsdl2-dev libsdl2-ttf-dev libsdl2-image-dev libvlc-dev nlohmann-json3-dev libgtest-dev
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: |
          pipx run clang-format==23.1.3 --dry-run --Werror src/*.cpp include/*.hpp tests/*.cpp tests/*.hpp
